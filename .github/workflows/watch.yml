name: internship-watch
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TERMS:      '["Summer 2027"]'
          CATEGORIES: '["Software","AI/ML/Data"]'
          LOCATIONS:  '["New York","NYC","Brooklyn","Remote"]'
      - name: Persist state
        run: |
          git config user.name  "internship-watch"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
